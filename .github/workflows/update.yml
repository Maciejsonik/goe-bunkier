name: Update Stream Stats & Dashboard

on:
  schedule:
    # Finals backup polling every 5 mins: Nov 14 17:00-23:59 UTC & Nov 15 00:00-05:59 UTC
    - cron: '*/5 17-23 14 11 *'
    - cron: '*/5 0-5 15 11 *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Scrape streams & build static files
        run: |
          python build_static.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data*.json history*.json stream_data*.csv tournament_analytics.json *.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stream stats [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
